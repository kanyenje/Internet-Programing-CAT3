<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - School Portal</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: Arial, sans-serif; background:#f4f9ff; color:#333; display:flex; flex-direction:column; min-height:100vh; }
        nav { background:#003366; padding:1rem 2rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; }
        nav .logo { color:white; font-size:1.5rem; font-weight:bold; }
        nav ul { list-style:none; display:flex; gap:1.5rem; flex-wrap:wrap; }
        nav ul li a { color:white; text-decoration:none; font-weight:bold; padding:0.5rem 1rem; border-radius:5px; transition:background 0.3s; }
        nav ul li a:hover { background:#00509e; }
        nav ul li a.active { background:#ffcc00; color:#003366; }
        .container { max-width:1100px; margin:2rem auto; padding:0 2rem; flex:1; }
        h1 { color:#003366; margin-bottom:1rem; }
        .gallery-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:1.5rem; margin:1.5rem 0; }
        .gallery-grid img { width:100%; height:180px; object-fit:cover; border-radius:10px; box-shadow:0 4px 8px rgba(0,0,0,0.1); transition:transform 0.3s; }
        .gallery-grid img:hover { transform:scale(1.05); }
        .media-section { background:white; padding:1.5rem; border-radius:10px; box-shadow:0 4px 8px rgba(0,0,0,0.1); margin:1.5rem 0; }
        .media-section video, .media-section audio { width:100%; max-width:600px; display:block; margin:1rem auto; border-radius:10px; }
        footer { background:#003366; color:white; text-align:center; padding:1rem 0; margin-top:2rem; }
        @media (max-width:600px) { nav { flex-direction:column; gap:0.5rem; } nav ul { justify-content:center; } }
    </style>
</head>
<body>

    <nav>
        <div class="logo">🏫 SchoolPortal</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="courses.html">Courses</a></li>
            <li><a href="gallery.html" class="active">Gallery</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>School Gallery</h1>

        <!-- Gallery Grid with Real Unsplash Images -->
        <div class="gallery-grid">
            <!-- Campus View -->
            <img src="https://images.unsplash.com/photo-1571260899304-4258f3b77a9d?w=300&h=180&fit=crop&crop=center" alt="Campus">
            <!-- Library -->
            <img src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?w=300&h=180&fit=crop&crop=center" alt="Library">
            <!-- Sports Day -->
            <img src="https://images.unsplash.com/photo-1574629816192-60317ff58c5d?w=300&h=180&fit=crop&crop=center" alt="Sports Day">
            <!-- Classroom -->
            <img src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?w=300&h=180&fit=crop&crop=center" alt="Classroom">
            <!-- Graduation -->
            <img src="https://images.unsplash.com/photo-1523050854058-8df90110c7f1?w=300&h=180&fit=crop&crop=center" alt="Graduation">
            <!-- Art Exhibition -->
            <img src="https://images.unsplash.com/photo-1542036170971-b7f4f10c9a8d?w=300&h=180&fit=crop&crop=center" alt="Art Exhibition">
        </div>

        <!-- Video -->
        <div class="media-section">
            <h2>🎥 School Promotional Video</h2>
            <video controls>
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <!-- Audio -->
        <div class="media-section">
            <h2>🎵 School Anthem</h2>
            <audio controls>
                <source src="https://www.w3schools.com/html/horse.ogg" type="audio/ogg">
                <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>
    </div>

    <footer>
        &copy; 2026 Bonface Maina
    </footer>

</body>
</html>
